<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personal Dashboard</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<meta name="theme-color" content="#5B4695">
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root{--sky1:#C97A4E;--sky2:#A85A78;--sky3:#5B4695;--sky4:#1E3A66;--glass:rgba(232,238,252,.48);--strong:rgba(255,255,255,.72);--border:rgba(255,255,255,.78);--ink:#241C3D;--muted:#6C5D89;--faint:#9C8DB6;--blue:#2E63C7;--teal:#219E93;--coral:#E85C72;--violet:#8A4FD1;--line:rgba(36,28,61,.13)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Nunito,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--sky1),var(--sky2) 38%,var(--sky3) 68%,var(--sky4));}button,input,textarea{font:inherit}button{cursor:pointer}
#app{max-width:760px;margin:0 auto;min-height:100vh;padding:20px 16px 30px;position:relative;overflow:hidden}.bubble{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.85),rgba(255,255,255,.04) 45%,rgba(255,255,255,.22) 78%);animation:float 20s ease-in-out infinite;box-shadow:inset -8px -8px 14px rgba(255,255,255,.25),inset 5px 5px 10px rgba(255,255,255,.6),0 4px 16px rgba(120,70,150,.1)}@keyframes float{50%{transform:translateY(-14px) translateX(8px)}}
.content{position:relative}.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}.title{font:700 27px 'Baloo 2',sans-serif;margin:0}.date{color:var(--muted);font-size:13px}.save{font:10px 'JetBrains Mono',monospace;color:var(--faint)}
.panel{background:linear-gradient(180deg,var(--strong),var(--glass));border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 30px rgba(120,70,150,.16);backdrop-filter:blur(10px);padding:14px;position:relative;margin-bottom:12px}.panel:before{content:"";position:absolute;left:0;right:0;top:0;height:45%;background:linear-gradient(180deg,rgba(255,255,255,.6),transparent);pointer-events:none}.panel>*{position:relative}
.reminder{display:flex;gap:9px;font-size:13px;color:var(--muted);line-height:1.45}.reminder b{color:var(--violet)}
.tabs,.subtabs{display:flex;gap:4px;padding:3px;background:rgba(255,255,255,.45);border:1px solid var(--border);border-radius:12px;overflow:auto}.tabs{margin-bottom:15px}.tabs button,.subtabs button{border:0;background:transparent;border-radius:9px;padding:8px 12px;font-weight:700;color:var(--faint);white-space:nowrap}.tabs button.active,.subtabs button.active{background:linear-gradient(180deg,#fff,#f4eeff);color:var(--blue);box-shadow:0 2px 6px rgba(62,142,255,.22)}
.section-title{font:600 15px 'Baloo 2',sans-serif;display:flex;align-items:center;gap:8px}.desc{color:var(--muted);font-size:12px;line-height:1.45}.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}.input,.textarea{width:100%;background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);outline:none}.textarea{resize:vertical;line-height:1.5}.btn{border:0;border-radius:10px;padding:10px 14px;color:white;font-weight:700}.btn.blue{background:linear-gradient(180deg,#3E76E0,#2451A8)}.btn.teal{background:linear-gradient(180deg,#2AB8AC,#1C8E84)}.btn.coral{background:linear-gradient(180deg,#F2748A,#D14D63)}.ghost{border:1px dashed rgba(36,28,61,.28);background:rgba(255,255,255,.4);color:var(--muted);border-radius:10px;padding:10px 12px;font-weight:600}
.drag{position:relative}.handle{display:flex;align-items:center;justify-content:center;gap:2px;height:16px;margin:0 0 -4px;color:var(--faint);opacity:.6;font-size:11px;letter-spacing:2px;cursor:grab;touch-action:none;user-select:none;border-radius:8px 8px 0 0;transition:opacity .15s ease,color .15s ease,background .15s ease}.handle:hover{opacity:1;color:var(--ink);background:rgba(255,255,255,.4)}.handle:active{cursor:grabbing}
.list{display:flex;flex-direction:column;gap:9px}.scroll{max-height:340px;overflow:auto;padding-right:2px}.scroll::-webkit-scrollbar{width:8px;height:8px}.scroll::-webkit-scrollbar-thumb{background:rgba(126,107,150,.22);border-radius:99px}
.item{background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:11px;padding:9px}.check{width:22px;height:22px;border-radius:7px;border:0;background:rgba(255,255,255,.72);box-shadow:inset 0 0 0 1.3px var(--line);display:inline-flex;align-items:center;justify-content:center;color:white}.check.done{background:linear-gradient(180deg,#2AB8AC,#1C8E84);box-shadow:none}.remove{border:1px solid var(--line);background:rgba(255,255,255,.6);color:#b5495e;border-radius:8px;width:26px;height:26px}.streak{font:700 10px 'JetBrains Mono',monospace;color:var(--teal);background:rgba(33,158,147,.18);padding:3px 8px;border-radius:999px;white-space:nowrap}.dots{display:flex;gap:8px;margin-top:6px}.dot{width:8px;height:8px;border-radius:50%;border:1px solid var(--faint);background:transparent}.dot.done{background:var(--teal);border-color:var(--teal)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.linkcard{min-height:118px}.muted{color:var(--muted)}.small{font-size:11px;color:var(--faint)}
.cal-plan-item{display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:11px;color:var(--muted);margin:3px 0;line-height:1.35}.cal-plan-item.done{text-decoration:line-through;color:var(--faint)}.cal-remove{flex:none;border:0;background:transparent;color:var(--faint);font-size:13px;line-height:1;padding:0 2px;border-radius:4px;transition:color .15s ease,background .15s ease}.cal-remove:hover{color:#b5495e;background:rgba(181,73,94,.12)}
.cal-indicators{display:flex;gap:3px;margin-top:3px}.cal-dot{width:5px;height:5px;border-radius:50%}.cal-dot.journal{background:var(--violet)}.cal-dot.habit{background:var(--teal)}
.timer{font:500 48px 'JetBrains Mono',monospace;text-align:center;margin:6px 0 12px}.timer-controls{display:flex;gap:4px;margin-bottom:10px;background:rgba(255,255,255,.5);padding:3px;border-radius:10px}.timer-controls button{flex:1;border:0;background:transparent;padding:7px;border-radius:8px;color:var(--faint);font-weight:700}.timer-controls button.active{background:white;color:var(--blue);box-shadow:0 2px 5px rgba(62,142,255,.2)}
.history-entry{padding:10px 12px}.history-text{font-size:13px;color:var(--muted);line-height:1.45;white-space:pre-wrap}.history-date{font:10.5px 'JetBrains Mono',monospace;color:var(--faint);margin-bottom:4px}.xp-panel{padding:11px 13px}.xp-track{height:8px;background:rgba(255,255,255,.65);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:8px}.xp-fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--blue),var(--teal));border-radius:99px;transition:width .25s ease}
@media(max-width:560px){#app{padding:14px 10px}.grid{grid-template-columns:1fr}.title{font-size:24px}}

/* ---- polish pass ---- */
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.title{background:linear-gradient(135deg,var(--ink) 20%,var(--violet) 70%,var(--blue));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.1px;text-shadow:0 1px 0 rgba(255,255,255,.3)}
.date{letter-spacing:.02em}
.panel{transition:box-shadow .25s ease, transform .25s ease}
.drag:hover>.panel{box-shadow:0 14px 34px rgba(120,70,150,.22);transform:translateY(-2px)}
.reminder>div:first-child{animation:sparklePulse 3.2s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(179,107,255,.55))}
@keyframes sparklePulse{0%,100%{opacity:.75;transform:scale(1) rotate(0deg)}50%{opacity:1;transform:scale(1.18) rotate(8deg)}}
.btn{transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;box-shadow:0 4px 12px rgba(62,142,255,.22)}
.btn.teal{box-shadow:0 4px 12px rgba(47,209,196,.28)}
.btn.coral{box-shadow:0 4px 12px rgba(255,122,138,.28)}
.btn:hover{transform:translateY(-1.5px);filter:brightness(1.06)}
.btn:active{transform:translateY(0) scale(.96);filter:brightness(.98)}
.ghost{transition:transform .15s ease, background .15s ease, box-shadow .15s ease}
.ghost:hover{background:rgba(255,255,255,.7);transform:translateY(-1.5px);box-shadow:0 4px 10px rgba(120,70,150,.14)}
.ghost:active{transform:translateY(0) scale(.97)}
.tabs button,.subtabs button{transition:color .18s ease, background .18s ease, transform .15s ease}
.tabs button:hover,.subtabs button:hover{color:var(--ink)}
.tabs button.active,.subtabs button.active{transform:translateY(-1px)}
.item{transition:background .15s ease, box-shadow .15s ease}
.check{transition:transform .15s ease, background .2s ease, box-shadow .2s ease}
.check:active{transform:scale(.86)}
.check.done{box-shadow:0 3px 10px rgba(47,209,196,.4)}
.remove{transition:transform .15s ease, background .15s ease, color .15s ease}
.remove:hover{background:#ffe4e8;color:#c05a6e;transform:scale(1.06)}
.input,.textarea{transition:box-shadow .18s ease, border-color .18s ease}
.input:focus,.textarea:focus{box-shadow:0 0 0 3px rgba(62,142,255,.18);border-color:var(--blue)}
.xp-panel{box-shadow:0 8px 24px rgba(179,107,255,.14)}
.xp-fill{position:relative;overflow:hidden}
.xp-fill:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:shimmer 2.4s linear infinite}
@keyframes shimmer{0%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.streak{box-shadow:0 2px 6px rgba(47,209,196,.25)}

/* timer */
.timer-top-row{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.timer-top-row .timer-controls{flex:1;margin-bottom:0}
.sound-toggle{flex:none;border:1px solid var(--border);background:rgba(255,255,255,.6);border-radius:10px;width:40px;height:40px;font-size:17px;display:flex;align-items:center;justify-content:center;transition:transform .15s ease, box-shadow .15s ease, background .15s ease}
.sound-toggle:hover{transform:translateY(-1.5px);box-shadow:0 4px 10px rgba(120,70,150,.18);background:#fff}
.sound-toggle:active{transform:translateY(0) scale(.92)}
.timer-ring{--pct:0;--ring-color:#3E76E0;width:176px;height:176px;margin:14px auto 14px;border-radius:50%;position:relative;background:conic-gradient(var(--ring-color) calc(var(--pct)*1%), rgba(255,255,255,.42) 0);transition:background .6s ease;box-shadow:0 10px 30px rgba(120,70,150,.18), inset 0 0 0 1px rgba(255,255,255,.5)}
.timer-ring-inner{position:absolute;inset:12px;border-radius:50%;background:linear-gradient(160deg,rgba(255,255,255,.94),rgba(255,255,255,.62));display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 3px 10px rgba(255,255,255,.9), inset 0 -8px 16px rgba(120,70,150,.07)}
.timer-ring .timer{margin:0;font-size:33px;letter-spacing:1px}
.phase-label{font:700 10.5px 'JetBrains Mono',monospace;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.08em}
.finished-label{font:700 12px 'Baloo 2',sans-serif;color:var(--coral);margin-top:5px;animation:popIn .45s ease}
.timer-ring.timer-running{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 10px 30px rgba(120,70,150,.18), inset 0 0 0 1px rgba(255,255,255,.5)}50%{box-shadow:0 10px 36px rgba(62,142,255,.3), inset 0 0 0 1px rgba(255,255,255,.6)}}
.timer-ring.timer-finished{animation:ringPulse 1s ease-in-out 3}
@keyframes ringPulse{0%,100%{box-shadow:0 10px 30px rgba(120,70,150,.18)}50%{box-shadow:0 10px 44px rgba(255,122,138,.6),0 0 0 10px rgba(255,122,138,.14)}}
@keyframes popIn{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}

/* bubbles */
.bubble{filter:blur(.3px)}

.drag{transition:box-shadow .15s ease}
.drag.dragging{opacity:.55;box-shadow:0 16px 34px rgba(120,70,150,.32);cursor:grabbing;z-index:20;position:relative}
.drag.dragging .panel{box-shadow:0 16px 34px rgba(120,70,150,.32)}
[data-swipe]{touch-action:pan-y;position:relative;will-change:transform}

@media (prefers-reduced-motion: reduce){*,.bubble{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}}

/* toast / undo */
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(16px);background:rgba(36,28,61,.94);color:#fff;padding:11px 10px 11px 16px;border-radius:12px;font-size:13px;display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease;box-shadow:0 12px 30px rgba(0,0,0,.3);z-index:200;max-width:min(92vw,380px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.tab-sync-banner{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-20px);background:rgba(46,99,199,.96);color:#fff;padding:9px 10px 9px 14px;border-radius:11px;font-size:12.5px;display:flex;align-items:center;gap:10px;opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease;box-shadow:0 10px 26px rgba(0,0,0,.25);z-index:200;max-width:min(92vw,340px)}
.tab-sync-banner.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.tab-sync-banner button{flex:none;background:rgba(255,255,255,.22);border:0;color:#fff;padding:5px 10px;border-radius:7px;font-weight:700;font-size:11.5px}
.tab-sync-banner button:hover{background:rgba(255,255,255,.34)}
.toast button{flex:none;background:rgba(255,255,255,.18);border:0;color:#fff;padding:7px 12px;border-radius:8px;font-weight:700;font-size:12px;transition:background .15s ease}
.toast button:hover{background:rgba(255,255,255,.3)}

/* empty states */
.empty-state{text-align:center;color:var(--faint);font-size:12.5px;font-style:italic;padding:20px 10px;line-height:1.5}

/* habit heatmap */
.heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px;max-width:200px}
.heat-cell{width:100%;aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.45);border:1px solid var(--line)}
.heat-cell.done{background:linear-gradient(180deg,#2AB8AC,#1C8E84);border-color:transparent}

/* settings */
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stat-trio{display:flex;gap:10px;margin-top:8px}
.stat-box{flex:1;background:rgba(255,255,255,.4);border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center}
.stat-num{font:700 21px 'JetBrains Mono',monospace;color:var(--violet)}
.kbd{display:inline-block;background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:5px;padding:1px 7px;font:700 11px 'JetBrains Mono',monospace;color:var(--ink)}

/* dark mode */
html.dark{--sky1:#171426;--sky2:#1B2340;--sky3:#16233F;--sky4:#0A1220;--glass:rgba(26,30,48,.55);--strong:rgba(255,255,255,.07);--border:rgba(255,255,255,.14);--ink:#ECE9FA;--muted:#B0A8CC;--faint:#8078A0;--blue:#6C97F2;--teal:#48D2C3;--coral:#FF8FA1;--violet:#B48CFF;--line:rgba(255,255,255,.14)}
html.dark .tabs,html.dark .subtabs{background:rgba(255,255,255,.06)}
html.dark .tabs button.active,html.dark .subtabs button.active{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.06));color:var(--blue)}
html.dark .input,html.dark .textarea{background:rgba(255,255,255,.08);color:var(--ink);border-color:var(--line)}
html.dark .item{background:rgba(255,255,255,.055)}
html.dark .check{background:rgba(255,255,255,.1)}
html.dark .ghost{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.24)}
html.dark .sound-toggle{background:rgba(255,255,255,.08);border-color:var(--border)}
html.dark .sound-toggle:hover{background:rgba(255,255,255,.16)}
html.dark .timer-ring-inner{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));box-shadow:inset 0 3px 10px rgba(255,255,255,.08),inset 0 -8px 16px rgba(0,0,0,.3)}
html.dark .timer-ring{box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.08)}
html.dark .panel:before{background:linear-gradient(180deg,rgba(255,255,255,.09),transparent)}
html.dark .bubble{opacity:.45}
html.dark .heat-cell{background:rgba(255,255,255,.06)}
html.dark .stat-box{background:rgba(255,255,255,.05)}
html.dark .kbd{background:rgba(255,255,255,.1);color:var(--ink)}
html.dark .scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18)}
html.dark .toast{background:rgba(10,9,18,.94)}
</style>
</head>
<body>
<div id="app">
  <div class="bubble" style="width:74px;height:74px;left:4%;top:8%;border:1px solid rgba(62,142,255,.45)"></div>
  <div class="bubble" style="width:52px;height:52px;right:5%;top:5%;border:1px solid rgba(179,107,255,.45);animation-duration:23s"></div>
  <div class="bubble" style="width:94px;height:94px;right:-2%;top:57%;border:1px solid rgba(47,209,196,.45);animation-duration:27s"></div>
  <div class="bubble" style="width:38px;height:38px;left:9%;top:78%;border:1px solid rgba(255,122,138,.4);animation-duration:19s"></div>
  <div class="content">
    <div class="top"><div><h1 class="title" id="greeting">good afternoon</h1><div class="date" id="date"></div></div><div class="save" id="save"></div></div>
    <div class="panel reminder"><div style="color:var(--violet);font-size:18px">✦</div><div><b id="remSchool"></b> <i id="remLine"></i></div></div>
    <div class="tabs" id="tabs">
      <button data-tab="today" class="active">Today</button><button data-tab="goals">Goals</button><button data-tab="journal">Journal</button><button data-tab="calendar">Calendar</button><button data-tab="links">Links</button><button data-tab="settings">Settings</button>
    </div>
    <main id="view"></main>
  </div>
</div>
<div id="toast" class="toast"></div>
<div id="tabSyncNotice" class="tab-sync-banner"><span>Updated in another tab</span><button data-action="reloadFromOtherTab">Reload</button></div>
<script>

ntly if you cared less about looking impressive?","What small act of courage would be useful tomorrow?","What is enough for you today?"];

async function syncPush(force){
  const cfg=getSyncConfig();if(!cfg)return;
  try{
    if(!force){
      setSyncStatus('Checking for conflicts…');
      const remoteJson=await syncRequest(`https://api.github.com/gists/${cfg.binId}`,{headers:ghHeaders(cfg.apiKey)});
      const remoteStr=gistFileContent(remoteJson);
      if(cfg.lastSyncedSnapshot && remoteStr!==null && JSON.stringify(JSON.parse(remoteStr))!==cfg.lastSyncedSnapshot){
        setSyncStatus('');
        const pullInstead=confirm("The cloud has changes from another device this device hasn't pulled yet.\n\nClick OK to pull those changes first (recommended), or Cancel to push anyway and overwrite them.");
        if(pullInstead){ await syncPull(); return; }
      }
    }
    setSyncStatus('Pushing…');
    await syncRequest(`https://api.github.com/gists/${cfg.binId}`,{method:'PATCH',headers:ghHeaders(cfg.apiKey,{'Content-Type':'application/json'}),body:JSON.stringify({files:{[GIST_FILENAME]:{content:JSON.stringify(data,null,2)}}})});
    setSyncConfig({...getSyncConfig(),lastSyncedSnapshot:JSON.stringify(data),lastSyncedAt:Date.now(),...tokenExpiryPatch()});
    setSyncStatus('Pushed ✓ '+new Date().toLocaleTimeString());
    render();
  }catch(err){setSyncStatus('Push failed: '+err.message)}
}
async function autoPushCheck(){
  const cfg=getSyncConfig();if(!cfg||!cfg.autoPush)return;
  try{
    const remoteJson=await syncRequest(`https://api.github.com/gists/${cfg.binId}`,{headers:ghHeaders(cfg.apiKey)});
    const remoteStr=gistFileContent(remoteJson);
    if(cfg.lastSyncedSnapshot && remoteStr!==null && JSON.stringify(JSON.parse(remoteStr))!==cfg.lastSyncedSnapshot){
      setSyncStatus('Auto-push paused — cloud has newer changes. Pull manually to resolve.');
      return;
    }
    await syncRequest(`https://api.github.com/gists/${cfg.binId}`,{method:'PATCH',headers:ghHeaders(cfg.apiKey,{'Content-Type':'application/json'}),body:JSON.stringify({files:{[GIST_FILENAME]:{content:JSON.stringify(data,null,2)}}})});
    setSyncConfig({...getSyncConfig(),lastSyncedSnapshot:JSON.stringify(data),lastSyncedAt:Date.now(),...tokenExpiryPatch()});
    setSyncStatus('Auto-synced ✓ '+new Date().toLocaleTimeString());
  }catch(err){setSyncStatus('Auto-push failed: '+err.message)}
}
async function syncPull(){
  const cfg=getSyncConfig();if(!cfg)return;
  setSyncStatus('Pulling…');
  try{
    const json=await syncRequest(`https://api.github.com/gists/${cfg.binId}`,{headers:ghHeaders(cfg.apiKey)});
    const raw=gistFileContent(json);
    if(raw===null) throw new Error(`Gist doesn't contain a ${GIST_FILENAME} file`);
    const remote=JSON.parse(raw);
    data={...structuredClone(defaults),...remote};
    save();
    setSyncConfig({...getSyncConfig(),lastSyncedSnapshot:JSON.stringify(remote),lastSyncedAt:Date.now(),...tokenExpiryPatch()});
    render();
    setSyncStatus('Pulled ✓ '+new Date().toLocaleTimeString());
  }catch(err){setSyncStatus('Pull failed: '+err.message)}
}

function shortTitle(text){const words=String(text).trim().split(/\s+/);return words.length<=8?String(text).trim():words.slice(0,8).join(' ')+'…'}
function bind(){
  const view=document.getElementById('view');
  if(!view) return;
  if(!view.dataset.bound){
    view.dataset.bound='1';
    view.addEventListener('click',e=>{
      const el=e.target.closest('[data-action]');
      if(el && view.contains(el)) onAction({currentTarget:el, target:e.target});
    });
    view.addEventListener('input',e=>{
      if(e.target && e.target.id==='journalText') autosaveJournal(e.target.value);
    });
    view.addEventListener('change',e=>{
      if(e.target && e.target.id==='timerMinutes'){
        const v=Math.max(1,Math.min(180,Number(e.target.value)||1));
        timer.remaining=v*60; timer.total=timer.remaining; render();
      } else if(e.target && e.target.id==='pomFocus'){
        timer.work=Math.max(1,Math.min(120,Number(e.target.value)||1));
        if(!timer.running&&timer.phase==='work'){ timer.remaining=timer.work*60; timer.total=timer.remaining; } render();
      } else if(e.target && e.target.id==='pomBreak'){
        timer.break=Math.max(1,Math.min(60,Number(e.target.value)||1));
        if(!timer.running&&timer.phase==='break'){ timer.remaining=timer.break*60; timer.total=timer.remaining; } render();
      } else if(e.target && e.target.id==='importFileInput'){
        const file=e.target.files && e.target.files[0];
        if(!file) return;
        const reader=new FileReader();
        reader.onload=()=>{
          try{
            const imported=JSON.parse(reader.result);
            if(confirm('Import this backup? This will replace all data currently saved on this device.')){
              data={...structuredClone(defaults),...imported};
              save(); render();
            }
          }catch(err){ alert('That file could not be read as a valid backup.'); }
        };
        reader.readAsText(file);
      }
    });
  }
  setupDrag(view);
  setupSwipe(view);
}

(u)setData(()=>data.links.push({id:uid(),name:n||u.replace(/^https?:\/\//,'').split('/')[0],url:/^https?:\/\//i.test(u)?u:'https://'+u,category:c||'Other'}))}else if(a==='undoDelete'){if(undoRestore){const fn=undoRestore;undoRestore=null;clearTimeout(undoTimer);document.getElementById('toast')?.classList.remove('show');fn();}}else if(a==='toggleDark'){const isDark=document.documentElement.classList.toggle('dark');localStorage.setItem('personal-dashboard-theme',isDark?'dark':'light');render();}else if(a==='exportData'){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`dashboard-backup-${today()}.json`;document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url);}else if(a==='importData'){document.getElementById('importFileInput')?.click();}else if(a==='clearAllData'){if(confirm('This permanently erases all your data on this device — habits, goals, journal entries, plans, links, XP, and sessions. This cannot be undone. Continue?')){localStorage.removeItem(KEY);data=structuredClone(defaults);tab='today';save();render();}}else if(a==='syncCreate'){syncCreateBin();}else if(a==='syncLinkExisting'){syncLinkExisting();}else if(a==='syncPush'){syncPush();}else if(a==='syncPull'){if(confirm('Pull the latest cloud save? This will replace the data on this device.'))syncPull();}else if(a==='syncUnlink'){if(confirm('Unlink cloud sync on this device? Your cloud bin will not be deleted.'))syncUnlink();}else if(a==='syncUpdateToken'){syncUpdateToken();}else if(a==='syncEditExpiry'){const cfg=getSyncConfig();if(!cfg)return;const current=cfg.tokenExpiresRaw?new Date(cfg.tokenExpiresRaw).toISOString().slice(0,10):'';const val=prompt("Enter this token's expiration date (YYYY-MM-DD), exactly as shown on its GitHub token page:",current);if(val){const patch=tokenExpiryPatch(val);if(Object.keys(patch).length){setSyncConfig({...cfg,...patch});render();}else alert('That date could not be read — please use YYYY-MM-DD format.')}}else if(a==='toggleAutoPush'){const cfg=getSyncConfig();if(cfg){setSyncConfig({...cfg,autoPush:!cfg.autoPush});render();}}}
function tickUpdate(){
  updateTabTitle();
  const ringEl=document.querySelector('.timer-ring');
  if(!ringEl) return;
  const display=timer.mode==='stopwatch'?timer.stopwatch:timer.remaining;
  const mm=String(Math.floor(display/60)).padStart(2,'0'),ss=String(display%60).padStart(2,'0');
  const textEl=ringEl.querySelector('.timer');
  if(textEl) textEl.textContent=mm+':'+ss;
  const total=Math.max(1,timer.total||600);
  const pct=timer.mode==='stopwatch'?0:Math.min(100,Math.max(0,Math.round(((total-timer.remaining)/total)*100)));
  ringEl.style.setProperty('--pct',pct);
}
function notifyTimerDone(title,body){
  if('Notification' in window && Notification.permission==='granted' && document.hidden){
    try{ new Notification(title,{body,icon:'icon-192.png',tag:'dashboard-timer'}); }catch(e){}
  }
}
function logSession(type,minutes){
  data.sessions=data.sessions||[];
  data.sessions.push({date:today(),minutes,type,ts:Date.now()});
}
function tickTimer(){
  if(!timer.running) return;
  if(timer.mode==='stopwatch'){
    timer.stopwatch=Math.max(0,Math.round((Date.now()-timer.startAt)/1000));
    tickUpdate();
    return;
  }
  let phaseChanged=false,finished=false,guard=0;
  while(guard<200){
    guard++;
    const remaining=Math.round((timer.endAt-Date.now())/1000);
    if(remaining>0){ timer.remaining=remaining; break; }
    if(timer.mode==='timer'){ timer.remaining=0; finished=true; break; }
    if(timer.phase==='work') logSession('pomodoro',timer.work);
    phaseChanged=true;
    timer.phase=timer.phase==='work'?'break':'work';
    const dur=(timer.phase==='work'?timer.work:timer.break)*60;
    timer.total=dur;
    timer.endAt+=dur*1000;
  }
  if(finished){
    timer.running=false;clearInterval(timer.interval);
    playChime('finish');timer.finished=true;
    notifyTimerDone('Timer finished ⏰',"Time's up — nice work.");
    logSession('timer',Math.round(timer.total/60));
    save();render();
    setTimeout(()=>{timer.finished=false;render()},5000);
    return;
  }
  if(phaseChanged){
    playChime('phase');
    notifyTimerDone(timer.phase==='break'?'Focus block done 🎯':'Break over ☕',timer.phase==='break'?'Time for a break.':'Back to focus.');
    save();render();
    return;
  }
  tickUpdate();
}
function timerAction(a,mode){
  if(a==='timerMode'){
    clearInterval(timer.interval);timer.running=false;timer.finished=false;timer.mode=mode;
    if(mode==='timer'){timer.remaining=600;timer.total=600}
    if(mode==='pomodoro'){timer.phase='work';timer.remaining=timer.work*60;timer.total=timer.remaining}
    if(mode==='stopwatch'){timer.stopwatch=0}
    render()
  }else if(a==='timerToggle'){
    timer.finished=false;
    timer.running=!timer.running;clearInterval(timer.interval);
    if(timer.running){
      if('Notification' in window && Notification.permission==='default'){ Notification.requestPermission(); }
      if(timer.mode==='stopwatch') timer.startAt=Date.now()-timer.stopwatch*1000;
      else timer.endAt=Date.now()+timer.remaining*1000;
      timer.interval=setInterval(tickTimer,1000);
    }
    render()
  }else if(a==='timerReset'){
    clearInterval(timer.interval);timer.running=false;timer.stopwatch=0;timer.finished=false;
    timer.remaining=timer.mode==='pomodoro'?timer.work*60:600;
    timer.total=timer.remaining;
    render()
  }else if(a==='timerToggleSound'){
    soundOn=!soundOn;localStorage.setItem('personal-dashboard-sound',soundOn?'on':'off');
    if(soundOn)playChime('phase');
    render()
  }
}
applyTheme();
document.getElementById('toast')?.addEventListener('click',e=>{
  const el=e.target.closest('[data-action="undoDelete"]');
  if(el) onAction({currentTarget:el,target:el});
});
document.addEventListener('keydown',e=>{
  const tag=(document.activeElement&&document.activeElement.tagName||'').toLowerCase();
  const isTyping=tag==='input'||tag==='textarea';
  if(e.code==='Space'&&!isTyping){
    e.preventDefault();
    timerAction('timerToggle');
  }else if(e.key==='Enter'&&tag==='input'){
    const fieldId=document.activeElement.id;
    const map={planInput:'addPlan',habitInput:'addHabit',goalInput:'addGoal',linkName:'addLink',linkUrl:'addLink',linkCat:'addLink',calendarPlanInput:'calendarSave',dumpGoalTitle:'confirmDumpGoal'};
    if(map[fieldId]){ e.preventDefault(); onAction({currentTarget:{dataset:{action:map[fieldId]}}}); }
  }else if(e.key==='Escape'){
    if(calendarComposeDate){ calendarComposeDate=null; render(); }
    if(dumpGoalId){ dumpGoalId=null; render(); }
  }
});
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));render();setInterval(updateHeader,15000);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && timer.running) tickTimer();
});
window.addEventListener('storage',e=>{
  if(e.key!==KEY || e.newValue===null) return;
  const activeTag=(document.activeElement&&document.activeElement.tagName||'').toLowerCase();
  const isTyping=activeTag==='input'||activeTag==='textarea';
  if(isTyping){
    const el=document.getElementById('tabSyncNotice');
    if(el) el.classList.add('show');
  }else{
    data=load();
    render();
  }
});
document.getElementById('tabSyncNotice')?.addEventListener('click',e=>{
  const el=e.target.closest('[data-action="reloadFromOtherTab"]');
  if(el){ data=load(); render(); document.getElementById('tabSyncNotice')?.classList.remove('show'); }
});
